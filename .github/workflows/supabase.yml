# Publicação automática na Supabase (projeto zcigwqvqmqatcivkrrsw).
# Sempre que há push para «main» com alterações em supabase/:
#   1. aplica as migrações novas de supabase/migrations (as que ainda não estão no histórico da base de dados);
#   2. publica as Edge Functions de supabase/functions (com o verify_jwt de supabase/config.toml).
# Também se pode correr à mão: GitHub → Actions → «Supabase» → «Run workflow».
#
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token da Supabase (supabase.com → Account → Access Tokens), só para o projeto do portal,
#                          com Database e Edge Functions em leitura/escrita. Expira (máx. 1 ano): renovar e substituir.
#   SUPABASE_DB_PASSWORD   password da base de dados (Project Settings → Database). As migrações ligam-se pelo
#                          «Session pooler» (IPv4), porque os servidores do GitHub não têm IPv6 para a ligação direta.
#
# Regras para não dessincronizar:
#   - migrações novas: ficheiro AAAAMMDDHHMMSS_nome.sql em supabase/migrations (nunca mudar o nome a uma já aplicada);
#   - não editar funções nem aplicar SQL diretamente no painel sem trazer a alteração para o repositório.
name: Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:
    inputs:
      tudo:
        description: "Publicar todas as funções e aplicar migrações pendentes"
        type: boolean
        default: true

concurrency:
  group: supabase-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: zcigwqvqmqatcivkrrsw
      POOLER_HOST: aws-0-eu-north-1.pooler.supabase.com
      SUPABASE_YES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam os segredos SUPABASE_ACCESS_TOKEN e/ou SUPABASE_DB_PASSWORD no repositório."
            exit 1
          fi

      - name: O que mudou
        id: mudou
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "migracoes=true" >> "$GITHUB_OUTPUT"; echo "funcoes=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ALTERADOS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "$ALTERADOS"
          echo "migracoes=$(echo "$ALTERADOS" | grep -q '^supabase/migrations/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "funcoes=$(echo "$ALTERADOS" | grep -qE '^supabase/(functions/|config\.toml)|^\.github/workflows/supabase\.yml' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Aplicar migrações pendentes
        if: steps.mudou.outputs.migracoes == 'true'
        run: |
          PASS_URL=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$PASS_URL"
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PASS_URL}@${POOLER_HOST}:5432/postgres"
          supabase migration list --remote="$DB_URL"
          supabase db push --remote="$DB_URL" --skip-vault --yes

      - name: Publicar Edge Functions
        if: steps.mudou.outputs.funcoes == 'true'
        run: supabase functions deploy --remote="$PROJECT_ID" --use-api --yes
