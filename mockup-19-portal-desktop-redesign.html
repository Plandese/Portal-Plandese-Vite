*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block;flex:none}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);height:100vh;transition:grid-template-columns .2s}
.app.slim{--sw:76px}

/* ── barra lateral escura ── */
.side{background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;height:68px;padding:0 20px;color:#fff;flex:none}
.brand i{width:30px;height:30px;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.4px}
.brand .tg{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--sidetx)}
.brand .tg:hover{background:var(--side2);color:#fff}
.sscroll{flex:1;min-height:0;overflow:auto;padding:4px 12px 12px;scrollbar-width:thin;scrollbar-color:#2a376b transparent}
.slab{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#5f6c9b;padding:16px 10px 6px;white-space:nowrap}
.it{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border-radius:11px;text-align:left;color:var(--sidetx);font-weight:600;font-size:13.8px;white-space:nowrap;position:relative}
.it svg{width:19px;height:19px}
.it:hover{background:var(--side2);color:#fff}
.it.on{background:linear-gradient(90deg,#2a57e0,#3b6cf5);color:#fff;box-shadow:0 6px 18px rgba(36,80,220,.4)}
.it .n{margin-left:auto;font-size:11px;background:#e5484d;color:#fff;border-radius:99px;padding:1px 7px;font-weight:700}
.it .st{margin-left:auto;color:#f5b73b;width:15px;height:15px;opacity:0}
.it:hover .st{opacity:.55}.it .st.f{opacity:1}

.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-info{background:var(--infobg);color:var(--info)}.c-gr{background:#edf0f6;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.bar{height:8px;border-radius:99px;background:#edf0f6;overflow:hidden}

.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--tint);color:var(--brand);flex:none}

.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.row{display:flex;align-items:center;gap:12px}
.sp{margin-left:auto}
.muted{color:var(--mute)}

.fld{display:flex;flex-direction:column;gap:6px}

.tog{width:40px;height:23px;border-radius:99px;background:#cdd5e4;position:relative;transition:.15s;flex:none}

.hm{display:grid;grid-template-columns:230px repeat(7,minmax(54px,1fr)) 70px;align-items:center;gap:6px}

.gt{display:grid;grid-template-columns:200px repeat(31,minmax(22px,1fr));gap:0;align-items:center}

.gt .ln{border-top:1px solid var(--line2);grid-column:1/-1;height:0}
/* ── kanban ── */
.kb{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;align-items:start;overflow:auto}
.kcol{background:#e9edf6;border-radius:var(--r);padding:12px;min-height:200px}

.kc{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.08);border:1px solid transparent}
.kc:hover{border-color:#bcd0ff}
.kc b{display:block;font-size:14px;margin:8px 0 4px}

/* ── cartões de pessoas/equipamentos ── */
.dir{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:13px;padding:12px;border-radius:13px;text-align:left;width:100%}

.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}

.stp{display:flex;gap:0;margin-bottom:22px}

.stp div:not(:last-child)::after{content:'';flex:1;height:2px;background:var(--line);margin:0 12px}
.stp em{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e9edf6;font-style:normal;font-size:13px;flex:none}

 `<div class="card"><table class="t"><thead><tr><th>Fornecedor</th><th>Categoria</th><th>Localidade</th><th>Avaliação</th></tr></thead><tbody>${FORN.map(f=>`<tr><td><div class="row"><span class="ibx">${ic(P.box)}</span><b>${f[0]}</b></div></td><td>${f[1]}</td><td>${f[3]}</td><td><span style="color:#f5a623;letter-spacing:2px">${'★'.repeat(Math.round(f[2]))}</span> <b>${f[2]}</b></td></tr>`).join('')}</tbody></table></div>`;

/* ── router ── */
function go(id){
 if(!MODS[id])return;st.view=id;const m=MODS[id];
 $('crumb').innerHTML=m.g?`${m.g}<span>/</span><b>${m.t}</b>`:'<b>Início</b>';
 $('page').innerHTML=V[id]();$('content').scrollTop=0;renderNav();
}
function rerender(){const s=$('content').scrollTop;$('page').innerHTML=V[st.view]();$('content').scrollTop=s}
$('page').addEventListener('click',e=>{
 const w=e.target.closest('[data-wk]');if(w){st.wk+=+w.dataset.wk;rerender();return}
 const s=e.target.closest('[data-seg]');if(s){const [k,v]=s.dataset.seg.split(':');st.tab[k]=v;rerender();return}
 const p=e.target.closest('[data-pick]');if(p){st.sel.colab=p.dataset.pick;rerender();return}
 const a=e.target.closest('[data-adv]');if(a){PEDIDOS[+a.dataset.adv].col++;toast('Pedido avançou de fase');rerender();return}
 const t=e.target.closest('[data-tog]');if(t){t.classList.toggle('on');toast('Acesso atualizado')}
});
$('page').addEventListener('input',e=>{
 if(e.target.id==='cq'||e.target.id==='pq'){const k=e.target.id;st.tab[k]=e.target.value;const pos=e.target.selectionStart;rerender();const n=$(k);n.focus();n.setSelectionRange(pos,pos)}
});
st.sel.colab='Tiago Lopes';
go('painel');
</script>
